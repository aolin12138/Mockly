name: Secret Scan

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for API key patterns in current code
        run: |
          set -e
          RED='\033[0;31m'
          NC='\033[0m'
          FOUND=0

          # Patterns that look like secrets
          PATTERNS=(
            'sk-[a-zA-Z0-9]{20,}'
            'sk-ant-[a-zA-Z0-9_-]{20,}'
            'AIza[0-9A-Za-z_-]{30,}'
            'ghp_[a-zA-Z0-9]{30,}'
            'ghu_[a-zA-Z0-9]{30,}'
            '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
            'eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}'
          )

          # Files to exclude
          EXCLUDE='package-lock.json|*.lock|*.png|*.jpg|*.gif|*.ico|*.woff2|*.svg|dist/|node_modules/|.env'

          for PATTERN in "${PATTERNS[@]}"; do
            RESULTS=$(grep -rnE "$PATTERN" --include='*.{js,jsx,ts,tsx,mjs,cjs,json,html,css,md}' . 2>/dev/null | grep -vE "$EXCLUDE" || true)
            if [ -n "$RESULTS" ]; then
              echo -e "${RED}SECRET PATTERN DETECTED: ${PATTERN}${NC}"
              echo "$RESULTS"
              echo ""
              FOUND=1
            fi
          done

          # Also scan for hardcoded credential constants
          CONST_RESULTS=$(grep -rnE "(const|let|var)\s+(TEST_KEY|API_KEY|SECRET|TOKEN|PASSWORD|apiKey)\s*=\s*'[a-zA-Z0-9_-]{8,}'" --include='*.{js,jsx,ts,tsx,mjs,cjs}' . 2>/dev/null | grep -v node_modules || true)
          if [ -n "$CONST_RESULTS" ]; then
            echo -e "${RED}HARDCODED CREDENTIAL CONSTANT DETECTED${NC}"
            echo "$CONST_RESULTS"
            echo ""
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Secret patterns found in committed code. Remove them and use environment variables instead."
            exit 1
          fi
          echo "✅ No secrets found"

      - name: Scan for secrets in git history (new commits only)
        run: |
          # Only scan commits pushed in this push event
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            echo "Scanning range: $RANGE"
            git diff "$RANGE" | grep -qE '^\+.*sk-[a-zA-Z0-9]{20,}' && {
              echo "::error::API key found in pushed commits!"
              exit 1
            } || echo "✅ No secrets in new commits"
          else
            echo "Full push — full repo scan done above"
          fi
